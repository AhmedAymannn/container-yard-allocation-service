services:
  mysql:
    image: mysql:8.0
    container_name: container-yard-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: container_yard_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: